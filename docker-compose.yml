services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lendinglibrary}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lendinglibrary}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: src/LendingLibrary.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-lendinglibrary};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      DataProtection__KeyPath: /keys
    volumes:
      - dataprotection-keys:/keys
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-shot prod migration container: the same image, run with --migrate instead of the normal
  # entrypoint. Not part of the default `docker compose up` — outside Development, `web` never
  # auto-migrates, so run this (or the equivalent `docker run <image> --migrate`) before starting
  # `web` in a real deployment: `docker compose --profile prod-migrate run --rm migrate`.
  migrate:
    profiles: ["prod-migrate"]
    build:
      context: .
      dockerfile: src/LendingLibrary.Web/Dockerfile
    entrypoint: ["dotnet", "LendingLibrary.Web.dll", "--migrate"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-lendinglibrary};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  dataprotection-keys:
